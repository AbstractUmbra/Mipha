[project]
name = "Mipha"
version = "2.0.0"
description = "A fun and lightweight Discord bot for personal use."
authors = [{ name = "Alex Nørgaard", email = "umbra@abstractumbra.dev" }]
dependencies = [
    "asqlite @ git+https://github.com/Rapptz/asqlite.git@master",
    "asyncpg",
    "beautifulsoup4",
    "discord-ext-menus @ git+https://github.com/Rapptz/discord-ext-menus@master",
    "discord-py[speed,voice] @ git+https://github.com/Rapptz/discord.py.git@master",
    "hondana[speed]",
    "imagetext-py",
    "jishaku",
    "legofy",
    "lru_dict",
    "lxml==6.1.2",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "orjson",
    "parsedatetime",
    "pastey.py @ git+https://github.com/PythonistaGuild/pastey.py.git@main",
    "pillow",
    "psutil",
    "pygit2",
    "pykakasi @ git+https://codeberg.org/miurahr/pykakasi.git@master",
    "python-a2s @ git+https://github.com/Yepoleb/python-a2s.git@master",
    "python-dateutil",
    "tabulate",
    "typing-extensions",
    "uvloop",
    "yt-dlp",
]
requires-python = "<4.0,>=3.13"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICEN[CS]E"]

[dependency-groups]
dev = ["ruff", "asyncpg-stubs", "pre-commit"]
minecraft = [
    "mcstatus>=14.0.0",
    "rcon @ git+https://github.com/conqp/rcon.git@master",
]

[tool.uv.sources]
"lru_dict" = { index = "umbra" }

[[tool.uv.index]]
name = "umbra"
url = "https://about.abstractumbra.dev/pip/"
explicit = true

[tool.ruff]
line-length = 125
target-version = "py313"
extend-exclude = ["extensions/heights"]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",
    "async-function-with-timeout", # dpy commonly uses this parameter
    "blocking-path-method-in-async-function", # i don't like trio/anyio
    "complex-structure",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",        # not needed here
    "DOC",
    "raw-string-in-exception",    # in this case this is okay
    "unused-import",
    "import-shadowed-by-loop-var",
    "undefined-local-with-import-star",
    "undefined-local-with-import-star-usage",
    "implicit-namespace-package",   # due to how I load modules this results in annoyances
    "pandas-use-of-dot-values",    # this is not a numpy codebase
    "try-except-in-loop",
    "useless-import-alias",  # pyright ruling for `as` imports needed
    "too-many-branches",
    "too-many-arguments",
    "magic-value-comparison",  # I hate this rule
    "no-self-use",
    "bad-quotes-inline-string",
    "ambiguous-unicode-character-string",
    "function-call-in-dataclass-default-argument",
    "non-empty-init-module",   # we do some stuff here
    "assert",     # assert is used for type checking in this codebase
    "private-member-access",
    "suppressible-exception",
    "raise-vanilla-args",   # over-eager rule
    "raise-within-try",   # unrealistic rule
    "extraneous-parentheses",
]
unfixable = [
    "line-too-long", # line length handled in other ways by ruff format
    "ERA",  # Don't delete commented out code
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = true
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# https://discuss.python.org/t/problems-with-typeis/55410/6
# https://discuss.python.org/t/problems-with-typeis/55410/46
# Until what can go into a TypeIs/TypeGuard changes, these are just dangerous.
"typing.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing.TypeGuard".msg = "TypeGuard is fundamentally unsafe"
"typing_extensions.TypeIs".msg = "TypeIs is fundamentally unsafe, even when using it as described to be safe"
"typing_extensions.TypeGuard".msg = "TypeGuard is fundamentally unsafe"

[tool.setuptools]
py-modules = []

[tool.pyright]
include = ["utilities/**/*.py", "extensions/**/*.py", "bot.py"]
useLibraryCodeForTypes = true
typeCheckingMode = "basic"
pythonVersion = "3.13"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
strictParameterNoneValue = true
reportMissingImports = "error"
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"
reportUnusedExpression = "error"
reportGeneralTypeIssues = "error"
reportDuplicateImport = "error"
reportUntypedFunctionDecorator = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
